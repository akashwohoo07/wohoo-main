name: Deploy Backend (beta)

# Auto-deploys the BETA backend on push to `beta` (app process only — beta has no worker).
# PROD is promoted MANUALLY after approval (see docs/DEPLOYMENT.md) — never auto-deployed,
# per the beta-first release workflow.
on:
  push:
    branches: [beta]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

concurrency:
  group: deploy-backend-beta
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-v7
      - run: npm ci
      - run: npm test

  deploy:
    name: Deploy beta to Fly
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy beta (app process only — beta has no worker)
        run: flyctl deploy --remote-only --ha=false --process-groups app --app wohoo-api-beta
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
